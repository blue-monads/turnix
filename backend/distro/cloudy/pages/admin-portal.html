<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Cloudy</title>
  <link rel="stylesheet" href="cloudy.css">
</head>
<body class="page">
  <div class="shell wide">
    <div class="top">
      <div class="brand">Cloudy · Admin</div>
      <div class="meta" id="who"></div>
    </div>
    <div class="stack">
      <div class="card">
        <h1>Tenants</h1>
        <p class="lede" id="health">Loading…</p>
        <div class="actions">
          <button type="button" class="secondary" id="refresh">Refresh</button>
          <a href="portal.html">Tenant portal</a>
          <a href="#" id="out">Sign out</a>
        </div>
        <p id="msg" class="msg"></p>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Tenant</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Flags</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h1>Add tenant user</h1>
        <p class="lede">Creates a Cloudy account and tenant slug. Leave verified unchecked to send a confirmation email.</p>
        <form id="add">
          <div class="form-row">
            <label>Name <input name="name" required></label>
            <label>Tenant <input name="tenant" required pattern="[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?"></label>
          </div>
          <div class="form-row">
            <label>Email <input name="email" type="email" required></label>
            <label>Password <input name="password" type="password" required minlength="8"></label>
          </div>
          <div class="form-row">
            <label>Role
              <select name="utype">
                <option value="normal">normal</option>
                <option value="admin">admin</option>
              </select>
            </label>
            <label>Pricing tier <input name="pricing_tier" placeholder="optional"></label>
          </div>
          <label class="check"><input name="verified" type="checkbox"> Mark verified now</label>
          <button type="submit">Add user</button>
        </form>
      </div>
    </div>
  </div>
  <script src="cloudy.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const rows = document.getElementById("rows");
    let session = null;

    document.getElementById("out").addEventListener("click", (e) => {
      e.preventDefault();
      Cloudy.signOut();
    });

    function setMsg(text, ok) {
      msg.className = "msg " + (ok ? "ok" : "err");
      msg.textContent = text || "";
    }

    async function loadUsers() {
      const data = await Cloudy.api("/zz/cloudy/users", { headers: Cloudy.headers() });
      rows.innerHTML = "";
      (data.users || []).forEach((u) => {
        const tr = document.createElement("tr");
        const status = [];
        if (u.is_verified) status.push("verified");
        else status.push("unverified");
        if (u.loaded) status.push("loaded");
        else status.push("unloaded");
        const flags = [];
        flags.push(u.is_lazy_loaded ? "lazy" : "eager");
        if (u.is_disabled) flags.push("disabled");
        tr.innerHTML =
          "<td>" + esc(u.tenant_key) + "</td>" +
          "<td>" + esc(u.fullname) + "</td>" +
          "<td>" + esc(u.email) + "</td>" +
          "<td><span class='badge'>" + esc(u.utype) + "</span></td>" +
          "<td>" + esc(status.join(" · ")) + "</td>" +
          "<td>" + esc(flags.join(" · ")) + "</td>" +
          "<td class='actions'></td>";
        const cell = tr.querySelector("td:last-child");
        if (u.loaded) {
          cell.append(actionBtn("Unload", () => unloadApp(u.tenant_key)));
        } else if (!u.is_disabled) {
          cell.append(actionBtn("Load", () => loadApp(u.tenant_key)));
        }
        cell.append(
          actionBtn(u.is_disabled ? "Enable" : "Disable", () => setDisabled(u.id, u.tenant_key, !u.is_disabled)),
          actionBtn(u.is_lazy_loaded ? "Eager" : "Lazy", () => setLazy(u.id, u.tenant_key, !u.is_lazy_loaded)),
          actionBtn("Open", () => window.open(Cloudy.tenantURL(session, u.tenant_key), "_blank")),
          actionBtn("Reset pw", () => resetPassword(u.id, u.email)),
        );
        rows.appendChild(tr);
      });
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function actionBtn(label, fn) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "secondary";
      b.textContent = label;
      b.addEventListener("click", fn);
      return b;
    }

    async function loadApp(name) {
      try {
        await Cloudy.api("/zz/cloudy/apps/" + encodeURIComponent(name) + "/load", {
          method: "POST",
          headers: Cloudy.headers(),
        });
        setMsg("Loaded " + name, true);
        await refreshHealth();
        await loadUsers();
      } catch (err) {
        setMsg(err.message);
      }
    }

    async function unloadApp(name) {
      try {
        await Cloudy.api("/zz/cloudy/apps/" + encodeURIComponent(name) + "/unload", {
          method: "POST",
          headers: Cloudy.headers(),
        });
        setMsg("Unloaded " + name, true);
        await refreshHealth();
        await loadUsers();
      } catch (err) {
        setMsg(err.message);
      }
    }

    async function setDisabled(id, tenant, disabled) {
      try {
        await Cloudy.api("/zz/cloudy/users/" + id + "/disable", {
          method: "POST",
          headers: Cloudy.headers(true),
          body: JSON.stringify({ is_disabled: disabled }),
        });
        setMsg((disabled ? "Disabled" : "Enabled") + " " + tenant, true);
        await refreshHealth();
        await loadUsers();
      } catch (err) {
        setMsg(err.message);
      }
    }

    async function setLazy(id, tenant, lazy) {
      try {
        await Cloudy.api("/zz/cloudy/users/" + id + "/lazy", {
          method: "POST",
          headers: Cloudy.headers(true),
          body: JSON.stringify({ is_lazy_loaded: lazy }),
        });
        setMsg(tenant + " is now " + (lazy ? "lazy-loaded" : "eager"), true);
        await loadUsers();
      } catch (err) {
        setMsg(err.message);
      }
    }

    async function resetPassword(id, email) {
      const password = prompt("New password for " + email);
      if (!password) return;
      try {
        await Cloudy.api("/zz/cloudy/users/" + id + "/reset-password", {
          method: "POST",
          headers: Cloudy.headers(true),
          body: JSON.stringify({ password }),
        });
        setMsg("Password reset for " + email, true);
      } catch (err) {
        setMsg(err.message);
      }
    }

    async function refreshHealth() {
      try {
        const h = await Cloudy.api("/zz/cloudy/health");
        document.getElementById("health").textContent =
          h.users + " users · " + h.tenants_loaded + " tenants loaded";
      } catch (err) {
        document.getElementById("health").textContent = err.message;
      }
    }

    Cloudy.requireSession({ admin: true }).then(async (data) => {
      if (!data) return;
      session = data;
      const user = data.user || {};
      document.getElementById("who").textContent = (user.email || "") + " · admin";
      await refreshHealth();
      try {
        await loadUsers();
      } catch (err) {
        setMsg(err.message);
      }
    });

    document.getElementById("refresh").addEventListener("click", async () => {
      try {
        await refreshHealth();
        await loadUsers();
        setMsg("Refreshed", true);
      } catch (err) {
        setMsg(err.message);
      }
    });

    document.getElementById("add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = {
        name: form.name.value.trim(),
        tenant: form.tenant.value.trim().toLowerCase(),
        email: form.email.value.trim(),
        password: form.password.value,
        utype: form.utype.value,
        pricing_tier: form.pricing_tier.value.trim(),
        verified: form.verified.checked,
      };
      try {
        await Cloudy.api("/zz/cloudy/users", {
          method: "POST",
          headers: Cloudy.headers(true),
          body: JSON.stringify(body),
        });
        form.reset();
        setMsg("User created", true);
        await refreshHealth();
        await loadUsers();
      } catch (err) {
        setMsg(err.message);
      }
    });
  </script>
</body>
</html>
